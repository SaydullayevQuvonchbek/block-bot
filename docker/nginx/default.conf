# Block-BOT — nginx vhost (Docker)
#
# public/webhook.php ning o'zi POST-only va TELEGRAM_WEBHOOK_SECRET sarlavhasini
# tekshiradi (public/webhook.php), shuning uchun bu yerda faqat:
#   - web-root'ni public/ ga ko'rsatish,
#   - PHP-FPM'ga uzatish,
#   - nozik fayllar/kataloglarni (dotfile, .sql, .log, vendor/ va h.k.) yashirish
# kifoya — bular ildiz .htaccess qoidalari bilan bir xil maqsadga xizmat qiladi.

server {
    listen 80;
    server_name _;

    root /app/public;
    index index.html;

    client_max_body_size 25m;

    # Nuqta bilan boshlanuvchi fayllarga (.env, .htaccess va h.k.) taqiqlash
    location ~ /\. {
        deny all;
    }

    # Faqat public/ ichidagi fayllarga to'g'ridan-to'g'ri ruxsat; qolgan hamma narsa
    # (agar noto'g'ri sozlangan bo'lsa ham) PHP orqali ishlaydi yoki rad etiladi.
    location ~* \.(env|sql|log|session|lock|md)$ {
        deny all;
    }

    location = /webhook.php {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index webhook.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        return 404;
    }
}
