name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  lint-and-test:
    name: "PHP Lint & Test Suite (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: Repozitoriyni olish
        uses: actions/checkout@v4

      - name: "PHP ${{ matrix.php }} ni sozlash"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pdo, pdo_sqlite, pdo_mysql, curl, mbstring, json, gd, fileinfo, zip, intl
          coverage: none
          tools: composer:v2

      - name: Composer keshi
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: "composer-${{ runner.os }}-${{ hashFiles('composer.json', 'composer.lock') }}"
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Bog'liqliklarni o'rnatish
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "PHP sintaksis tekshiruvi (php -l)"
        run: |
          set -e
          find src bin public config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Test to'plamini ishga tushirish
        env:
          APP_ENV: test
          DB_DRIVER: sqlite
        run: php bin/run_tests.php

  docker-build:
    name: "Docker tasvirini yig'ish (smoke test)"
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Repozitoriyni olish
        uses: actions/checkout@v4

      - name: Docker Buildx sozlash
        uses: docker/setup-buildx-action@v3

      - name: Ilova tasvirini yig'ish (push qilinmaydi, faqat build tekshiruvi)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          tags: block-bot/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
